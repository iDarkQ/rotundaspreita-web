name: End-to-end tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest
    env:
      DATABASE_URL: postgresql://playwright:playwright@127.0.0.1:55432/rotundaspreita_e2e_test
      PLAYWRIGHT_DATABASE_URL: postgresql://playwright:playwright@127.0.0.1:55432/rotundaspreita_e2e_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - uses: ikalnytskyi/action-setup-postgres@v8
        with:
          username: playwright
          password: playwright
          database: rotundaspreita_e2e_test
          port: 55432
          postgres-version: "15"
      - run: yarn install --frozen-lockfile
      - run: yarn prisma generate
      - run: yarn playwright install chromium
      - run: yarn test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
